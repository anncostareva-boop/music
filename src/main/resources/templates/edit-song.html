<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Song - Float</title>

    <!-- Tailwind UI Layout Engine -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Link to Global Theme File -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex flex-col min-h-screen justify-between bg-[#0a0a0f] text-purple-100 antialiased">

<!-- NAVIGATION BAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-grow max-w-xl w-full mx-auto px-4 py-12 flex flex-col justify-center">

    <!-- Header Title -->
    <div class="mb-8 text-center sm:text-left">
        <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-purple-400 tracking-tight">
            Edit Track
        </h1>
        <p class="text-xs text-purple-200/50 mt-1 tracking-wide">Update song metadata and artwork configuration.</p>
    </div>

    <!-- Alert Messages -->
    <div th:if="${message}"
         th:text="${message}"
         class="mb-6 p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-medium text-center">
    </div>

    <!-- Glassmorphic Form Card -->
    <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl">
        <form th:action="@{/client/edit-song/{id}(id=*{songId})}"
              th:object="${form}"
              method="post"
              enctype="multipart/form-data"
              class="space-y-6">

            <!-- Hidden Song ID -->
            <input type="hidden" th:field="*{songId}"/>

            <!-- Song Title Input -->
            <div class="space-y-2">
                <label for="songName" class="block text-xs font-semibold text-purple-300/80 uppercase tracking-widest pl-1">
                    Track Title
                </label>
                <input type="text"
                       id="songName"
                       th:field="*{songName}"
                       placeholder="Enter song title"
                       required
                       class="w-full px-4 py-3.5 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-purple-200/30 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all text-sm">
            </div>

            <!-- Genre Input -->
            <div class="space-y-2">
                <label for="genre" class="block text-xs font-semibold text-purple-300/80 uppercase tracking-widest pl-1">
                    Genre
                </label>
                <input type="text"
                       id="genre"
                       th:field="*{genre}"
                       placeholder="e.g. Synthwave, Rock, Pop"
                       required
                       class="w-full px-4 py-3.5 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-purple-200/30 focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition-all text-sm">
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex items-center justify-end gap-3">
                <a th:href="@{/profile}"
                   class="px-6 py-3.5 rounded-full border border-white/10 hover:bg-white/5 text-purple-200 hover:text-white text-xs font-semibold tracking-wider transition-all">
                    Cancel
                </a>

                <button type="submit"
                        class="btn-neon px-8 py-3.5 rounded-full text-white font-semibold text-xs tracking-wider transition-all shadow-lg shadow-purple-600/20 active:scale-[0.98]">
                    Save Changes
                </button>
            </div>

        </form>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
