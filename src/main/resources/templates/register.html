<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="form" type="com.music.app.forms.RegisterForm"*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Float</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="flex flex-col min-h-screen">

<main class="flex-grow flex items-center justify-center px-6 py-8">

    <div class="glass-card w-full max-w-2xl p-8 md:p-10 rounded-[2.5rem] text-center">

        <div class="w-12 h-12 rounded-full btn-neon mx-auto mb-6 flex items-center justify-center">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
            </svg>
        </div>

        <h2 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-300 tracking-tight mb-2">
            Create Account
        </h2>

        <p class="text-sm text-purple-200/50 tracking-wide mb-8">
            Join Float to expand your musical horizons.
        </p>

        <!-- Alerts -->

        <div th:if="${message}"
             class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm"
             th:text="${message}">
        </div>

        <div th:if="${passwordNotEqual}"
             class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm"
             th:text="${passwordNotEqual}">
        </div>

        <div th:if="${error}"
             class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm"
             th:text="${error}">
        </div>

        <form th:action="@{/register}"
              th:object="${form}"
              method="post"
              class="space-y-5 text-left">

            <div class="grid md:grid-cols-2 gap-5">

                <div>
                    <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-2">
                        Username
                    </label>

                    <input type="text"
                           th:field="*{userName}"
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10"
                           placeholder="Pick a unique username"
                           required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-2">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10"
                           placeholder="yourname@example.com"
                           required>
                </div>

            </div>

            <div>
                <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-2">
                    Phone Number
                </label>

                <input type="text"
                       th:field="*{phoneNumber}"
                       class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10"
                       placeholder="+380..."
                       required>
            </div>

            <div class="grid md:grid-cols-2 gap-5">

                <div>
                    <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-2">
                        Password
                    </label>

                    <input type="password"
                           th:field="*{password}"
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10"
                           placeholder="••••••••"
                           required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-2">
                        Confirm Password
                    </label>

                    <input type="password"
                           th:field="*{confirmPassword}"
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10"
                           placeholder="••••••••"
                           required>
                </div>

            </div>

            <button type="submit"
                    class="btn-neon w-full text-white font-semibold py-4 rounded-full text-sm tracking-wider mt-3">
                Create Account
            </button>

        </form>

        <p class="text-sm text-purple-200/40 mt-7">
            Already have an account?

            <a th:href="@{/login}"
               class="text-purple-400 hover:text-purple-300 font-semibold underline underline-offset-4 ml-1">
                Log in
            </a>
        </p>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
