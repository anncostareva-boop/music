<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="songsPlaylist" type="java.util.List<com.music.app.entity.Song>"*/-->
<!--/*@thymesVar id="playlist" type="com.music.app.entity.Playlist"*/-->
<!--/*@thymesVar id="currentUserId" type="java.lang.Long"*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF Tokens for AJAX/fetch logging -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <title th:text="${playlist != null ? playlist.playlistName + ' - Float' : 'Playlist Tracks - Float'}">Playlist Tracks - Float</title>

    <!-- Tailwind UI Layout Engine -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Link to Global Theme File -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex flex-col min-h-screen justify-between">

<!-- NAVIGATION BAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- Flash Notification Messages -->
<div th:if="${message}"
     th:text="${message}"
     class="max-w-5xl mx-auto w-full px-4 mt-2 p-4 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-medium text-center">
</div>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

    <!-- Hero Playlist Header -->
    <div class="glass-card rounded-[2.5rem] p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
        <div class="flex items-center gap-6">
            <!-- Playlist Cover Artwork / Dynamic Thumbnail -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden bg-white/5 border border-white/10 flex-shrink-0 shadow-2xl flex items-center justify-center relative group">
                <img th:src="@{/files/{name}(name=${playlist != null and playlist.artworkFileName != null ? playlist.artworkFileName : 'cat.jpg'})}"
                     alt="Playlist Cover"
                     class="w-full h-full object-cover">
            </div>

            <div class="space-y-1.5">
                <span class="text-[11px] uppercase tracking-widest font-bold text-purple-400">Playlist</span>
                <h1 class="text-2xl sm:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-100 to-purple-300 tracking-tight"
                    th:text="${playlist != null ? playlist.playlistName : (playlistName != null ? playlistName : 'Custom Playlist')}">
                    Playlist Title
                </h1>
                <p class="text-xs text-purple-200/50 flex items-center gap-2 font-light">
                    <span th:text="${songsPlaylist != null ? #lists.size(songsPlaylist) : 0} + ' tracks'">0 tracks</span>
                    <span>•</span>
                    <span th:text="${playlist != null and playlist.playlistAuthor != null ? 'Created by ' + playlist.playlistAuthor : 'Curated collection'}">Curated collection</span>
                </p>
            </div>
        </div>

        <!-- Header Action Controls -->
        <div class="flex flex-wrap items-center gap-3 self-stretch sm:self-auto justify-end">
            <!-- Add Song Button (Owner Only) -->
            <a th:if="${playlist != null and currentUserId != null and currentUserId == playlist.userId}"
               th:href="@{/client/songs}"
               class="px-5 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold tracking-wide shadow-lg shadow-purple-500/20 hover:shadow-purple-500/35 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-2">
                <span>➕</span>
                <span>Add Songs</span>
            </a>

            <!-- Back to Playlists -->
            <a th:href="@{/client/playlists}"
               class="px-5 py-2.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-purple-200 text-xs font-semibold tracking-wide transition-all">
                ← Back
            </a>
        </div>
    </div>

    <!-- Table Container Card -->
    <div class="glass-card rounded-[2rem] overflow-visible p-2">
        <div class="overflow-x-visible">
            <table class="w-full text-left border-collapse">
                <tbody class="divide-y divide-white/[0.04] text-sm font-light text-purple-100">

                <!-- Dynamic Row Iterator loop -->
                <tr th:each="song, iterStat : ${songsPlaylist}"
                    class="hover:bg-white/[0.02] transition-colors duration-150 group relative">

                    <!-- 1. Track Index & Cover Artwork & Title Block -->
                    <td class="py-4 px-6 font-medium text-white flex items-center gap-4">
                        <span class="text-xs text-purple-200/30 w-4 block group-hover:hidden" th:text="${iterStat.count}">1</span>
                        <span class="text-xs text-purple-400 w-4 hidden group-hover:block cursor-pointer play-btn"
                              th:data-src="@{/files/{name}(name=${song.fileName})}"
                              th:data-song-id="${song.songID}">▶</span>

                        <!-- Dynamic Song Thumbnail Container -->
                        <div class="w-10 h-10 rounded-lg overflow-hidden bg-white/5 flex-shrink-0 shadow-md">
                            <img th:src="@{/files/{name}(name=${song.artworkFileName != null ? song.artworkFileName : 'default-cover.jpg'})}"
                                 alt="Cover Artwork"
                                 class="w-full h-full object-cover">
                        </div>

                        <!-- Track Metadata Stack -->
                        <div class="flex flex-col">
                            <span class="font-semibold text-white tracking-wide cursor-pointer hover:text-purple-300 transition-colors play-btn"
                                  th:data-src="@{/files/{name}(name=${song.fileName})}"
                                  th:data-song-id="${song.songID}"
                                  th:text="${song.songName}">Song Title</span>
                            <span class="text-xs text-purple-200/40 mt-0.5" th:text="${song.genreName != null ? song.genreName : 'General'}">Genre</span>
                        </div>
                    </td>

                    <!-- 2. Artist Column -->
                    <td class="py-4 px-6 text-purple-200/70 font-medium"
                        th:text="${song.artistName != null ? song.artistName : 'Unknown Artist'}">Artist Name</td>

                    <!-- 3. Likes Button Column -->
                    <td class="py-4 px-6 text-center">
                        <form th:action="@{/client/toggle-like/{id}(id=${song.songID})}"
                              method="post"
                              class="inline">
                            <button type="submit"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 hover:scale-105 transition-all text-xs font-mono">
                                <span th:text="${song != null && likedSongIds != null && likedSongIds.contains(song.songID) ? '❤️' : '🤍'}">🤍</span>
                                <span th:text="${song != null ? song.songLikesAmount : 0}">0</span>
                            </button>
                        </form>
                    </td>

                    <!-- 4. Play Single Track Action -->
                    <td class="py-4 px-6 text-right">
                        <button type="button"
                                class="play-btn text-xs font-semibold text-purple-300 hover:text-white transition-colors duration-200 inline-flex items-center gap-1 cursor-pointer"
                                th:data-src="@{/files/{name}(name=${song.fileName})}"
                                th:data-song-id="${song.songID}">
                            <span>Play</span>
                            <span>&rarr;</span>
                        </button>
                    </td>

                    <!-- 5. Options Menu (Rendered ONLY for Playlist Owner) -->
                    <td class="py-4 px-6 text-right relative">
                        <div th:if="${playlist != null and currentUserId != null and currentUserId == playlist.userId}"
                             class="relative inline-block text-left">
                            <button type="button"
                                    class="action-menu-btn text-purple-200/50 hover:text-white transition-colors duration-200 p-2 text-lg rounded-full hover:bg-white/5 focus:outline-none">
                                •••
                            </button>

                            <!-- Dropdown Menu Box -->
                            <div class="action-dropdown hidden absolute right-0 mt-2 w-52 rounded-2xl bg-purple-950/90 border border-purple-500/20 shadow-2xl backdrop-blur-xl py-1.5 z-50 text-left">
                                <form th:action="@{/client/delete-song-playlist/{playlistId}(playlistId=${playlist.playlistId})}"
                                      method="post"
                                      onsubmit="return confirm('Remove this track from the playlist?');"
                                      class="w-full">
                                    <input type="hidden" name="songId" th:value="${song.songID}" />
                                    <button type="submit"
                                            class="w-full flex items-center gap-2.5 px-4 py-2.5 text-xs text-red-400 hover:bg-red-500/20 hover:text-red-300 transition-colors">
                                        <span>🗑️</span> Delete from Playlist
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- Empty Fallback State View block -->
                <tr th:if="${#lists.isEmpty(songsPlaylist)}">
                    <td colspan="5" class="py-16 text-center">
                        <div class="flex flex-col items-center justify-center space-y-3">
                            <span class="text-3xl">🎵</span>
                            <p class="text-sm text-purple-200/40 font-light">No songs have been added to this playlist yet.</p>
                            <a th:if="${playlist != null and currentUserId != null and currentUserId == playlist.userId}"
                               th:href="@{/client/songs}"
                               class="mt-2 px-4 py-2 rounded-full bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/30 text-purple-300 text-xs font-medium transition-all">
                                Discover tracks to add &rarr;
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- Global Sticky Audio Player -->
<div id="player-container" class="fixed bottom-0 left-0 w-full bg-[#0a0a0f]/90 backdrop-blur-md border-t border-white/10 p-3 hidden z-50 transform translate-y-full transition-transform duration-300">
    <div class="max-w-5xl mx-auto px-4">
        <audio id="global-audio-player" controls class="w-full h-10 rounded-full outline-none" controlsList="nodownload">
            Your browser does not support the audio element.
        </audio>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        // Dropdown toggle logic
        const menuButtons = document.querySelectorAll(".action-menu-btn");

        menuButtons.forEach(button => {
            button.addEventListener("click", function(e) {
                e.stopPropagation();
                const currentDropdown = this.nextElementSibling;

                document.querySelectorAll(".action-dropdown").forEach(dropdown => {
                    if (dropdown !== currentDropdown) {
                        dropdown.classList.add("hidden");
                    }
                });

                currentDropdown.classList.toggle("hidden");
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener("click", function(e) {
            if (!e.target.closest('.action-dropdown')) {
                document.querySelectorAll(".action-dropdown").forEach(dropdown => {
                    dropdown.classList.add("hidden");
                });
            }
        });

        // Audio Player Logic
        const audioPlayer = document.getElementById("global-audio-player");
        const playerContainer = document.getElementById("player-container");
        const playButtons = document.querySelectorAll(".play-btn");

        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

        playButtons.forEach(button => {
            button.addEventListener("click", function() {
                const audioUrl = this.dataset.src;
                const songId = this.dataset.songId;

                if (!audioUrl) return;

                playerContainer.classList.remove("hidden");
                playerContainer.classList.remove("translate-y-full");

                audioPlayer.src = audioUrl;
                audioPlayer.play();

                if (songId) {
                    const headers = {
                        "Content-Type": "application/x-www-form-urlencoded"
                    };

                    if (csrfToken && csrfHeader) {
                        headers[csrfHeader] = csrfToken;
                    }

                    fetch("/api/history/record", {
                        method: "POST",
                        headers: headers,
                        body: "songId=" + encodeURIComponent(songId)
                    })
                        .then(response => console.log("History saved:", response.status))
                        .catch(error => console.error("Error logging history:", error));
                }
            });
        });
    });
</script>

</body>
</html>
