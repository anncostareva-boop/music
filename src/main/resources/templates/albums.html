<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="albums" type="java.util.List<com.music.app.entity.Album>"*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Albums - Float</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-[#08080c] text-white flex flex-col min-h-screen justify-between selection:bg-purple-500 selection:text-white antialiased">

<!-- NAVBAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" th:text="${successMessage}"
         class="w-full p-4 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-medium text-center">
    </div>
    <div th:if="${errorMessage}" th:text="${errorMessage}"
         class="w-full p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-medium text-center">
    </div>

    <!-- Page Header with "+ Create Album" Modal Trigger -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/5 pb-4">
        <div>
            <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-400 tracking-tight">
                Browse Albums
            </h1>
            <p class="text-xs text-purple-200/50 mt-0.5 tracking-wide">Explore featured releases, records, and album catalogs.</p>
        </div>

        <!-- Inline Button triggering Create Modal -->
        <button type="button"
                onclick="openCreateAlbumModal()"
                class="px-5 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold tracking-wide shadow-lg shadow-purple-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-1.5">
            <span class="font-bold">+</span> Create Album
        </button>
    </div>

    <!-- Table Container Card -->
    <div class="glass-card rounded-[2rem] p-2 border border-white/10 bg-white/[0.02]">
        <div class="overflow-visible">
            <table class="w-full text-left border-collapse">
                <tbody class="divide-y divide-white/[0.04] text-sm font-light text-purple-100">

                <tr th:each="album, iterStat : ${albums}"
                    class="hover:bg-white/[0.02] transition-colors duration-150 group">

                    <!-- Index & Artwork & Title -->
                    <td class="py-4 px-6 font-medium text-white flex items-center gap-4">
                        <span class="text-xs text-purple-200/30 w-4 block group-hover:hidden" th:text="${iterStat.count}">1</span>

                        <span class="text-xs text-purple-400 w-4 hidden group-hover:block cursor-pointer">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </span>

                        <div class="w-10 h-10 rounded-lg overflow-hidden bg-purple-500/20 border border-purple-500/30 flex items-center justify-center flex-shrink-0 shadow-md relative">
                            <img th:if="${album.artworkFileName != null and !album.artworkFileName.isBlank()}"
                                 th:src="@{/files/{name}(name=${album.artworkFileName})}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                                 alt="Artwork"
                                 class="w-full h-full object-cover">
                            <span class="text-xs font-bold text-purple-300 uppercase"
                                  th:style="${album.artworkFileName != null and !album.artworkFileName.isBlank()} ? 'display: none;' : 'display: flex;'"
                                  th:text="${album.albumName != null and !album.albumName.isEmpty() ? #strings.substring(album.albumName, 0, 1) : 'A'}">A</span>
                        </div>

                        <div class="flex flex-col">
                            <a th:href="@{/client/album-songs/{id}(id=${album.albumId})}"
                               class="font-semibold text-white tracking-wide hover:text-purple-300 transition-colors"
                               th:text="${album.albumName}">
                                Album Title
                            </a>
                            <span class="text-xs text-purple-200/40 mt-0.5">Full Release</span>
                        </div>
                    </td>

                    <!-- Artist Column -->
                    <td class="py-4 px-6 text-purple-200/70 font-medium">
                        <span class="text-xs text-purple-200/40 mr-1">By</span>
                        <span th:text="${album.artistName != null ? album.artistName : 'Unknown Artist'}">Artist Name</span>
                    </td>

                    <!-- Badge -->
                    <td class="py-4 px-6 text-center font-mono text-xs text-purple-300">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 font-sans text-xs">
                            Album
                        </span>
                    </td>

                    <!-- Three-Dot Menu -->
                    <td class="py-4 px-6 text-right relative">
                        <div class="inline-block text-left dropdown-container">
                            <button type="button"
                                    onclick="toggleMenu(this)"
                                    class="text-purple-200/50 hover:text-white p-2 rounded-lg hover:bg-white/5 transition-all text-sm font-bold tracking-widest focus:outline-none">
                                &bull;&bull;&bull;
                            </button>

                            <div class="dropdown-menu hidden absolute right-6 top-12 z-50 w-48 rounded-2xl bg-[#111118] border border-white/10 shadow-2xl p-1.5 backdrop-blur-2xl text-left space-y-1">
                                <!-- View Tracks -->
                                <a th:href="@{/client/album-songs/{id}(id=${album.albumId})}"
                                   class="flex items-center justify-between px-3 py-2 text-xs font-medium text-purple-200 hover:text-white hover:bg-white/5 rounded-xl transition-colors">
                                    <span>View Tracks</span>
                                    <span class="text-purple-400">&rarr;</span>
                                </a>

                                <div class="border-t border-white/5 my-1"></div>

                                <!-- Delete Album -->
                                <form th:action="@{/client/delete-album/{id}(id=${album.albumId})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this album?');"
                                      class="w-full">
                                    <button type="submit"
                                            class="w-full flex items-center justify-between px-3 py-2 text-xs font-medium text-rose-300 hover:text-rose-200 hover:bg-rose-500/10 rounded-xl transition-colors text-left">
                                        <span>Delete Album</span>
                                        <span class="text-rose-400 font-bold">&times;</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(albums)}">
                    <td colspan="4" class="py-12 text-center text-sm text-purple-200/30 font-light tracking-wide">
                        No albums available in the database right now.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- CREATE ALBUM MODAL -->
<div id="createAlbumModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md hidden px-4">
    <div class="glass-card w-full max-w-lg rounded-[2.5rem] p-8 border border-white/10 bg-[#111118] shadow-2xl space-y-6">

        <div class="flex items-center justify-between border-b border-white/5 pb-4">
            <div>
                <h3 class="text-xl font-black text-white tracking-tight">Create an Album</h3>
                <p class="text-xs text-purple-300/60 mt-0.5">Publish a new record release to the library.</p>
            </div>
            <button type="button" onclick="closeCreateAlbumModal()" class="text-purple-300/50 hover:text-white text-lg font-bold p-1">
                &times;
            </button>
        </div>

        <form th:action="@{/client/add-album}" method="post" enctype="multipart/form-data" class="space-y-4">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

            <!-- Title -->
            <div class="space-y-1.5">
                <label for="albumName" class="block text-[10px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Album Title
                </label>
                <input type="text"
                       name="albumName"
                       id="albumName"
                       placeholder="e.g. Midnight Horizon, Solaris"
                       required
                       class="w-full px-4 py-3 rounded-2xl bg-white/[0.04] border border-white/10 text-white placeholder-white/20 focus:outline-none focus:border-purple-500/60 text-xs">
            </div>

            <!-- Artist -->
            <div class="space-y-1.5">
                <label for="artistName" class="block text-[10px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Artist / Band Name
                </label>
                <input type="text"
                       name="artistName"
                       id="artistName"
                       placeholder="e.g. Your Band or Stage Name"
                       required
                       class="w-full px-4 py-3 rounded-2xl bg-white/[0.04] border border-white/10 text-white placeholder-white/20 focus:outline-none focus:border-purple-500/60 text-xs">
            </div>

            <!-- Artwork File -->
            <div class="space-y-1.5">
                <label class="block text-[10px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Cover Artwork
                </label>
                <input type="file"
                       name="artwork"
                       accept="image/png, image/jpeg, image/webp"
                       class="w-full text-xs text-purple-300/60
                              file:mr-4 file:py-2.5 file:px-4
                              file:rounded-xl file:border file:border-purple-500/30
                              file:text-xs file:font-semibold
                              file:bg-purple-500/10 file:text-purple-200
                              hover:file:bg-purple-500/20
                              cursor-pointer bg-white/[0.02] border border-white/10 rounded-2xl p-2">
            </div>

            <!-- Modal Action Buttons -->
            <div class="flex items-center justify-end gap-3 pt-3 border-t border-white/5">
                <button type="button"
                        onclick="closeCreateAlbumModal()"
                        class="px-5 py-2.5 rounded-full border border-white/10 hover:bg-white/5 text-purple-200 text-xs font-semibold transition-all">
                    Cancel
                </button>
                <button type="submit"
                        class="px-6 py-2.5 rounded-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold shadow-lg shadow-purple-600/20 active:scale-[0.98] transition-all">
                    Publish Album
                </button>
            </div>
        </form>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Dropdown and Modal Handling Script -->
<script>
    function toggleMenu(button) {
        const menu = button.nextElementSibling;
        const allMenus = document.querySelectorAll('.dropdown-menu');
        allMenus.forEach(m => {
            if (m !== menu) m.classList.add('hidden');
        });
        menu.classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown-container')) {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.add('hidden'));
        }
    });

    function openCreateAlbumModal() {
        document.getElementById('createAlbumModal').classList.remove('hidden');
    }

    function closeCreateAlbumModal() {
        document.getElementById('createAlbumModal').classList.add('hidden');
    }
</script>

</body>
</html>
