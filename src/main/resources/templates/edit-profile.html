<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Float</title>

    <!-- Tailwind UI Layout Engine -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Link to Global Theme File -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex flex-col min-h-screen justify-between">

<!-- NAVIGATION BAR -->
<header class="w-full z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN FORM WRAPPER -->
<main class="flex-grow flex items-center justify-center px-6 py-12">

    <div class="glass-card w-full max-w-xl p-8 md:p-10 rounded-[2.5rem] transition-transform duration-500 hover:scale-[1.01]">

        <!-- Header Title -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-300 tracking-tight">
                Edit Profile
            </h1>
            <p class="text-xs text-purple-200/50 mt-1 tracking-wide">Update your personal information and contact details</p>
        </div>

        <!-- Form -->
        <form th:action="@{/edit-profile}"
              th:object="${form}"
              method="post"
              class="space-y-5 text-left">

            <!-- Username Input -->
            <div class="space-y-1.5">
                <label for="userName" class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest pl-1">
                    Username
                </label>
                <input type="text"
                       id="userName"
                       th:field="*{userName}"
                       placeholder="Enter username"
                       required
                       class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all text-sm font-light">
            </div>
            <p th:if="${usernameExists}"
               th:text="${usernameExists}"
               class="text-red-400 text-sm mt-1">
            </p>

            <!-- Email Input -->
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest pl-1">
                    Email Address
                </label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="name@example.com"
                       required
                       class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all text-sm font-light">
            </div>
            <p th:if="${emailExists}"
               th:text="${emailExists}"
               class="text-red-400 text-sm mt-1">
            </p>

            <!-- Phone Number Input -->
            <div class="space-y-1.5">
                <label for="phoneNumber" class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest pl-1">
                    Phone Number
                </label>
                <input type="tel"
                       id="phoneNumber"
                       th:field="*{phone}"
                       placeholder="+380..."
                       class="w-full px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all text-sm font-light">
            </div>
            <p th:if="${phoneExists}"
               th:text="${phoneExists}"
               class="text-red-400 text-sm mt-1">
            </p>

            <!-- Action Buttons -->
            <div class="pt-4 flex items-center justify-end gap-3">
                <a th:href="@{/client/songs}"
                   class="px-6 py-3.5 rounded-full border border-white/10 hover:bg-white/5 text-purple-200 hover:text-white text-xs font-semibold tracking-wider transition-all">
                    Cancel
                </a>
                <button type="submit"
                        class="btn-neon px-8 py-3.5 rounded-full text-white font-semibold text-xs tracking-wider">
                    Save Changes
                </button>
            </div>

        </form>

    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
