<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Album - Float Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-[#08080c] text-white min-h-screen flex flex-col justify-between antialiased selection:bg-purple-500 selection:text-white">

<!-- NAVBAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN WRAPPER -->
<main class="flex-grow max-w-xl w-full mx-auto px-6 py-10 flex flex-col justify-center space-y-6">

    <!-- Top Action Bar -->
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <a th:href="@{/admin/albums}"
           class="px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-purple-200 text-xs font-semibold tracking-wide transition-all">
            &larr; Back to Albums
        </a>
        <span class="text-[10px] px-3.5 py-1 rounded-full uppercase font-bold tracking-widest bg-purple-500/10 border border-purple-500/20 text-purple-300">
            Catalog Manager
        </span>
    </div>

    <!-- Header Block -->
    <div>
        <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Add New Album</h1>
        <p class="text-xs text-purple-300/60 mt-1">Register an official record release with cover art into the database.</p>
    </div>

    <!-- Feedback Alerts -->
    <div th:if="${successMessage}"
         th:text="${successMessage}"
         class="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-medium text-center backdrop-blur-md">
    </div>

    <div th:if="${message}"
         th:text="${message}"
         class="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-medium text-center backdrop-blur-md">
    </div>

    <!-- Form Glass Card -->
    <div class="glass-card rounded-[2.5rem] p-8 border border-white/10 shadow-2xl backdrop-blur-xl bg-white/[0.02]">
        <form th:action="@{/admin/add-album}" th:object="${form}" method="post" enctype="multipart/form-data" class="space-y-6">

            <!-- Album Title Field -->
            <div class="space-y-2">
                <label for="albumName" class="block text-[11px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Album Title
                </label>
                <input type="text"
                       id="albumName"
                       th:field="*{albumName}"
                       placeholder="e.g. Abbey Road, Random Access Memories"
                       required
                       class="w-full px-4 py-3 rounded-2xl bg-white/[0.04] border border-white/10 text-white placeholder-white/20 focus:outline-none focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/20 transition-all text-xs">
            </div>

            <!-- Artist Field -->
            <div class="space-y-2">
                <label for="artistName" class="block text-[11px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Artist / Band
                </label>
                <input type="text"
                       id="artistName"
                       th:field="*{artistName}"
                       placeholder="e.g. The Beatles, Daft Punk"
                       required
                       class="w-full px-4 py-3 rounded-2xl bg-white/[0.04] border border-white/10 text-white placeholder-white/20 focus:outline-none focus:border-purple-500/60 focus:ring-2 focus:ring-purple-500/20 transition-all text-xs">
            </div>

            <!-- File Upload Field -->
            <div class="space-y-2">
                <label class="block text-[11px] font-semibold text-purple-300/70 uppercase tracking-widest">
                    Cover Artwork
                </label>
                <div class="relative">
                    <input type="file"
                           name="artwork"
                           id="artwork"
                           accept="image/png, image/jpeg, image/webp"
                           class="w-full text-xs text-purple-300/60
                                  file:mr-4 file:py-2.5 file:px-4
                                  file:rounded-xl file:border file:border-purple-500/30
                                  file:text-xs file:font-semibold
                                  file:bg-purple-500/10 file:text-purple-200
                                  hover:file:bg-purple-500/20 file:transition-all
                                  cursor-pointer bg-white/[0.02] border border-white/10 rounded-2xl p-2">
                </div>
                <p class="text-[10px] text-white/30 pl-1">Supported formats: PNG, JPG, WEBP (Max 5MB)</p>
            </div>

            <!-- Actions Footer -->
            <div class="pt-4 flex items-center justify-end gap-3 border-t border-white/5">
                <a th:href="@{/admin/albums}"
                   class="px-5 py-2.5 rounded-full border border-white/10 hover:bg-white/5 text-purple-200 text-xs font-semibold transition-all">
                    Cancel
                </a>
                <button type="submit"
                        class="px-6 py-2.5 rounded-full bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs transition-all shadow-lg shadow-purple-600/20 active:scale-[0.98]">
                    Save Album
                </button>
            </div>

        </form>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
