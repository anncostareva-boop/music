<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="flex flex-col justify-between">

<header class="w-full px-6 py-4 flex justify-between items-center z-10">
    <div th:replace="~{fragments/navbar :: navbar}" class="flex-grow"></div>
</header>

<main class="flex-grow flex flex-col items-center justify-center text-center px-4 max-w-2xl mx-auto my-12">

    <div class="glass-card p-10 md:p-14 rounded-[2.5rem] w-full transition-transform duration-500 hover:scale-[1.01]">

        <div class="w-12 h-12 rounded-full btn-neon mx-auto mb-6 flex items-center justify-center">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M12 3v18M8 7v10M4 11v2M16 7v10M20 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-4 bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-purple-400">
            Expand your music horizons with Float
        </h1>

        <p class="text-lg text-purple-200/70 font-light tracking-wide mb-8">
            Listen, create, and discover your true sound.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">

            <!-- Guest -->
            <a sec:authorize="isAnonymous()"
               th:href="@{/login}"
               class="btn-neon text-white font-semibold px-8 py-4 rounded-full text-md tracking-wider w-full sm:w-auto">
                Get Started
            </a>

            <!-- Logged in -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/client/songs}"
               class="btn-neon text-white font-semibold px-8 py-4 rounded-full text-md tracking-wider w-full sm:w-auto">
                Browse Songs
            </a>

        </div>

    </div>

</main>

<footer class="w-full text-center py-4 text-xs text-white/20 tracking-widest">
    FLOAT MUSIC APP &copy; 2026
</footer>

</body>
</html>
