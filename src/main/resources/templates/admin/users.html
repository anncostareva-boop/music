<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - Admin Float</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex flex-col min-h-screen justify-between">

<!-- NAVBAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

    <!-- Flash Notification Messages -->
    <div th:if="${successMessage}" th:text="${successMessage}"
         class="w-full p-4 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-medium text-center">
    </div>

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/5 pb-4">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-400 tracking-tight">
                    Users Management
                </h1>
                <span class="text-xs px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 font-medium text-purple-300"
                      th:text="${users != null ? #lists.size(users) : 0} + ' registered'">0 registered</span>
            </div>
            <p class="text-xs text-purple-200/50 mt-1 tracking-wide">Inspect accounts, permissions, and directory details.</p>
        </div>

        <div class="flex items-center gap-3">
            <a th:href="@{/admin/dashboard}"
               class="px-4 py-2.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-purple-200 text-xs font-semibold tracking-wide transition-all">
                ← Dashboard
            </a>
            <a th:href="@{/admin/add-user}"
               class="px-5 py-2.5 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold tracking-wide shadow-lg shadow-purple-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-1.5">
                <span>➕</span> Add User
            </a>
        </div>
    </div>

    <!-- Table Container Card -->
    <div th:if="${not #lists.isEmpty(users)}" class="glass-card rounded-[2rem] overflow-hidden p-2">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="text-[11px] uppercase tracking-wider text-purple-300/60 border-b border-white/5">
                    <th scope="col" class="py-3 px-6">ID</th>
                    <th scope="col" class="py-3 px-6">User</th>
                    <th scope="col" class="py-3 px-6">Email</th>
                    <th scope="col" class="py-3 px-6">Phone</th>
                    <th scope="col" class="py-3 px-6 text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-white/[0.04] text-sm font-light text-purple-100">
                <tr th:each="user : ${users}"
                    class="hover:bg-white/[0.02] transition-colors duration-150 group">

                    <!-- ID -->
                    <td class="py-4 px-6 font-mono text-xs text-purple-300/60">
                        <span th:text="'#' + ${user.userId}">#1</span>
                    </td>

                    <!-- Username & Avatar -->
                    <td class="py-4 px-6 font-medium text-white flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-xs text-purple-300 flex-shrink-0 shadow-md">
                            👤
                        </div>
                        <span class="font-semibold text-white group-hover:text-purple-300 transition-colors"
                              th:text="${user.userName}">Username</span>
                    </td>

                    <!-- Email -->
                    <td class="py-4 px-6 text-purple-200/70 text-xs" th:text="${user.email}">user@example.com</td>

                    <!-- Phone -->
                    <td class="py-4 px-6 text-purple-200/50 font-mono text-xs"
                        th:text="${user.phoneNumber != null and !user.phoneNumber.isBlank() ? user.phoneNumber : '—'}">+380...</td>

                    <!-- Action -->
                    <td class="py-4 px-6 text-right">
                        <a th:href="@{/admin/user-details/users/{id}(id=${user.userId})}"
                           class="px-3.5 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 hover:bg-purple-500/20 hover:text-white text-xs font-medium transition-all">
                            Inspect &rarr;
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Empty Fallback State Container -->
    <div th:if="${#lists.isEmpty(users)}"
         class="glass-card p-12 rounded-[2rem] text-center flex flex-col items-center justify-center space-y-4">
        <div class="w-14 h-14 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-2xl text-purple-300 shadow-inner">
            👥
        </div>
        <div>
            <h3 class="text-xl font-bold text-white mb-1">No users found</h3>
            <p class="text-xs text-purple-200/50 max-w-sm font-light">There are currently no registered users in the database.</p>
        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
