<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="liked_songs" type="java.util.List<com.music.app.entity.Song>"*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liked Songs - Float</title>

    <!-- Tailwind UI Layout Engine -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Link to Global Theme File -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="flex flex-col min-h-screen justify-between">

<!-- NAVIGATION BAR -->
<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<!-- MAIN CONTENT WRAPPER -->
<main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

    <!-- Page Header Actions -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/5 pb-4">
        <div>
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-400 tracking-tight">
                    Your Favorite Songs
                </h1>
                <span class="text-xs px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 font-medium text-purple-300"
                      th:text="${#lists.size(liked_songs)} + ' saved'">0 saved</span>
            </div>
            <p class="text-xs text-purple-200/50 mt-1 tracking-wide">All the tracks you've saved in one place.</p>
        </div>

        <a th:href="@{/client/songs}"
           class="btn-neon text-white text-xs font-semibold px-5 py-3 rounded-full tracking-wider flex items-center gap-1.5 self-end sm:self-auto">
            Browse Music
        </a>
    </div>

    <!-- Table Container Card (When Liked Songs Exist) -->
    <div th:if="${not #lists.isEmpty(liked_songs)}" class="glass-card rounded-[2rem] overflow-hidden p-2">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <tbody class="divide-y divide-white/[0.04] text-sm font-light text-purple-100">

                <tr th:each="likedSong, iterStat : ${liked_songs}"
                    class="hover:bg-white/[0.02] transition-colors duration-150 group">

                    <!-- Index & Artwork & Title -->
                    <td class="py-4 px-6 font-medium text-white flex items-center gap-4">
                        <span class="text-xs text-purple-200/30 w-4 block group-hover:hidden" th:text="${iterStat.count}">1</span>
                        <span class="text-xs text-purple-400 w-4 hidden group-hover:block cursor-pointer play-btn"
                              th:data-src="@{/files/{name}(name=${likedSong.fileName})}"
                              th:data-song-id="${likedSong.songID}">▶</span>

                        <!-- Dynamic Song Artwork Container -->
                        <div class="w-10 h-10 rounded-lg overflow-hidden bg-white/5 flex-shrink-0 shadow-md">
                            <img th:src="@{/files/{name}(name=${likedSong.artworkFileName != null ? likedSong.artworkFileName : 'default-cover.jpg'})}"
                                 alt="Cover Artwork"
                                 class="w-full h-full object-cover">
                        </div>

                        <div class="flex flex-col">
                            <span class="font-semibold text-white tracking-wide cursor-pointer hover:text-purple-300 transition-colors play-btn"
                                  th:data-src="@{/files/{name}(name=${likedSong.fileName})}"
                                  th:data-song-id="${likedSong.songID}"
                                  th:text="${likedSong.songName}">Song Title</span>
                            <span class="text-xs text-purple-200/40 mt-0.5">Saved Track</span>
                        </div>
                    </td>

                    <!-- Genre Tag -->
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-xs font-medium text-purple-300"
                              th:text="${likedSong.genreName != null ? likedSong.genreName : 'General'}">Genre</span>
                    </td>

                    <!-- Clickable Interactive Like Button + Count -->
                    <td class="py-4 px-6 text-right">
                        <form th:action="@{/client/toggle-like/{id}(id=${likedSong.songID})}"
                              method="post"
                              class="inline">
                            <button type="submit"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 hover:scale-105 transition-all text-xs font-mono"
                                    title="Toggle like status">
                                <span th:text="${likedSong != null && likedSongIds != null && likedSongIds.contains(likedSong.songID) ? '❤️' : '🤍'}">❤️</span>
                                <span th:text="${likedSong != null ? likedSong.songLikesAmount : 0}">0</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Empty Fallback State Container -->
    <div th:if="${#lists.isEmpty(liked_songs)}"
         class="glass-card p-12 rounded-[2rem] text-center flex flex-col items-center justify-center space-y-4">
        <div class="w-14 h-14 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shadow-inner">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        <div>
            <h3 class="text-xl font-bold text-white mb-1">You haven't liked any songs yet</h3>
            <p class="text-xs text-purple-200/50 max-w-sm font-light">Explore the music catalog and tap the heart icon to save tracks here.</p>
        </div>
    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
