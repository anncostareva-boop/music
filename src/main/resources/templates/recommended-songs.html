<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Songs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-purple-500 selection:text-white">

<header class="w-full px-6 py-4 z-10">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 pb-6 border-b border-slate-800/60">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                <span>Recommended for You</span>
                <span class="text-xs px-2.5 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 font-medium text-purple-400"
                      th:text="${#lists.size(recommended)} + ' picks'">0 picks</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1">Curated tracks based on your listening taste</p>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(recommended)}" class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-900/90 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                <tr>
                    <th scope="col" class="px-6 py-4 w-12 text-center">#</th>
                    <th scope="col" class="px-6 py-4">Title</th>
                    <th scope="col" class="px-6 py-4">Artist</th>
                    <th scope="col" class="px-6 py-4 text-center">Likes</th>
                    <th scope="col" class="px-6 py-4 text-right">Action</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                <tr th:each="song, iterStat : ${recommended}"
                    class="hover:bg-slate-800/40 transition-colors group">

                    <td class="px-6 py-4 text-center font-medium text-slate-500" th:text="${iterStat.count}">1</td>

                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700/50 flex items-center justify-center text-base group-hover:border-purple-500/40 transition-colors">
                                ✨
                            </div>
                            <div class="flex flex-col">
                                    <span class="font-semibold text-white group-hover:text-purple-300 transition-colors"
                                          th:text="${song.songName}">
                                        Song Title
                                    </span>
                                <span class="text-xs text-purple-300/60 mt-0.5"
                                      th:text="${song.genre != null ? song.genre : 'General'}">
                                        Genre
                                    </span>
                            </div>
                        </div>
                    </td>

                    <td class="px-6 py-4 text-slate-300 font-medium"
                        th:text="${song.artist != null ? song.artist : 'Unknown Artist'}">
                        Artist Name
                    </td>

                    <td class="px-6 py-4 text-center">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-xs font-medium text-purple-300">
                                ❤️ <span th:text="${song.songLikesAmount != null ? song.songLikesAmount : 0}">0</span>
                            </span>
                    </td>

                    <td class="px-6 py-4 text-right">
                        <a th:href="@{/songs/{id}(id=${song.songID})}"
                           class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-medium transition-all shadow-md shadow-purple-600/20 active:scale-95">
                            <span>Listen</span>
                            <span>&rarr;</span>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(recommended)}"
         class="flex flex-col items-center justify-center py-20 px-4 rounded-3xl border border-dashed border-slate-800 bg-slate-900/20 text-center">
        <div class="w-14 h-14 rounded-2xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-3xl mb-4 shadow-lg">
            🔮
        </div>
        <h3 class="text-xl font-bold text-slate-200 mb-1">No recommendations yet</h3>
        <p class="text-sm text-slate-400 max-w-sm mb-6">Listen to and like a few tracks first so we can build custom recommendations for you.</p>
        <a th:href="@{/songs}"
           class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm transition-all shadow-lg shadow-purple-600/20 active:scale-95">
            Explore Music
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
