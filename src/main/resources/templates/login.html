<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="flex flex-col min-h-screen">

<!-- MAIN LOGIN CARD -->
<main class="flex-grow flex items-center justify-center px-6 pt-12 pb-6">

    <div class="glass-card w-full max-w-xl p-8 md:p-10 rounded-[2.5rem] text-center transition-transform duration-500 hover:scale-[1.01]">


        <!-- Title -->
        <h2 class="text-3xl md:text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-300 tracking-tight mb-2">
            Login
        </h2>

        <p class="text-xs text-purple-200/50 tracking-wide mb-6">
            Welcome back! Please enter your credentials.
        </p>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm"
             th:text="${successMessage}">
        </div>

        <!-- Error Message -->
        <div th:if="${param.error}"
             class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm flex items-center justify-center gap-2">
            <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span>Incorrect username or password</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-4 text-left">

            <div>
                <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-1.5">
                    Username
                </label>

                <input type="text"
                       name="username"
                       placeholder="Enter your username"
                       required
                       class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-purple-300/70 uppercase tracking-widest mb-1.5">
                    Password
                </label>

                <input type="password"
                       name="password"
                       placeholder="••••••••"
                       required
                       class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-purple-300/30 focus:outline-none focus:border-purple-500/50 focus:bg-white/10 transition-all text-sm">
            </div>

            <button type="submit"
                    class="btn-neon w-full text-white font-semibold py-3.5 rounded-full text-sm tracking-wider mt-2">
                Login
            </button>

        </form>

        <p class="text-xs text-purple-200/40 mt-6">
            Don't have an account yet?

            <a th:href="@{/register}"
               class="text-purple-400 hover:text-purple-300 font-semibold underline underline-offset-4 ml-1">
                Sign up
            </a>
        </p>

    </div>

</main>

<!-- Footer Container with explicit top padding to pull it closer -->
<div class="pb-6" th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
